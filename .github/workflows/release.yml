name: Release APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, for example 0.2.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Decode signing key
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/noctra.jks"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build signed APK
        run: gradle assembleRelease --no-daemon --stacktrace -PversionName="$VERSION" -PversionCode="${{ github.run_number }}"
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/noctra.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Noctra.apk
          gh release create "v$VERSION" Noctra.apk --title "Noctra $VERSION" --generate-notes --target "${{ github.sha }}"
